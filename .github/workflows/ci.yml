name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - name: Pin npm release path
        run: npm install -g npm@11.9.0
      - run: npm ci
      - name: Audit committed PR scope
        if: github.event_name == 'pull_request'
        run: npm run audit:pr-scope
      - run: npm run ci
      - name: Generate CycloneDX SBOM
        if: always()
        run: npm run sbom
      - name: Write build provenance
        if: always()
        run: npm run build:provenance
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verify-artifacts-${{ github.run_id }}
          path: |
            artifacts/**
            dist/**
          if-no-files-found: warn
          retention-days: 14

  database-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v2
        with:
          version: 2.107.0
          github-token: ${{ github.token }}
      - name: Apply every migration on a fresh local database
        run: supabase db start
      - name: Lint database functions and schema
        run: supabase db lint --local --level warning --fail-on error
      - name: Run pgTAP privacy, methodology and governance tests
        run: supabase test db
      - name: Run concurrent invitation replay race
        run: bash supabase/tests/privacy_vault_concurrency.sh
      - name: Exercise synthetic backup, discard and restore
        run: bash supabase/tests/data_lifecycle_recovery.sh

  browser-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - name: Pin npm release path
        run: npm install -g npm@11.9.0
      - run: npm ci
      - name: Install browser engines with system dependencies
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run cross-browser public quality checks
        run: npm run test:e2e
      - name: Upload browser quality artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-quality-${{ github.run_id }}
          path: |
            playwright-report/**
            test-results/**
          if-no-files-found: warn
          retention-days: 14
